modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''A Minecraft library that adds tooltips \nto items through translation keys and (a bit) more!

Special text effects are powered by Ember's Text API.
Documentation available at tysontheember.dev.
Jar-in-jar inclusion has been explicitly approved for this mod.
See Ember's Modding License for details.

1.20.1 port by Nikdo53
'''

[[dependencies.${mod_id}]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="${forge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true #mandatory
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
